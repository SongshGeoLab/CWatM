name: workflow uploading Codecov
# SongshGeoLab fork: 原本是 on: [push]，已停用。
# 它需要 secrets.CODECOV_TOKEN（fork 上没有）且 fail_ci_if_error: true，
# 所以每次 push 必然红叉。它其实也不跑任何测试——只是把仓库里已提交的
# coverage.xml 上传上去。改为仅手动触发。
on: workflow_dispatch
jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      OS: ${{ matrix.os }}
      PYTHON: "3.10"
    steps:
      - uses: actions/checkout@main
      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version: "3.10"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage/reports/
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true